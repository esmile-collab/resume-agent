# Input: 启动脚本、后端服务和本地开发环境读取默认参数。
# Output: 提供数据库、日志和 CLI 的默认配置值。
# Pos: 系统配置基线文件。
# Rule: 一旦我被更新，务必同步更新本文件头注释与所属目录 README。
# Resume Agent 默认配置

# 数据库配置
database:
  path: .data/resume_agent.db

# 日志配置
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: .data/logs/resume_agent.log

# CLI 配置
cli:
  prompt: 'resume_agent> '
  editor: vim
