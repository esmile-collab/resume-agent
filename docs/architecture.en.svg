<svg xmlns="http://www.w3.org/2000/svg" width="960" height="912" viewBox="0 0 960 912" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Resume Agent — system architecture and feedback loops</title>
<desc id="desc">Find gaps, revise through user feedback, and preserve every version。Resume &amp; JD：Role · files · new facts；Plan &amp; tools：Intent · context · tools；Score &amp; gaps：Before writing a draft；Generate &amp; polish：Drafts · block edits；Review &amp; revise：Check facts, add context；Record findings：Scores · traces · diffs；Structured memory &amp; versions：Profile · experience · job tracks · snapshots · artifacts；Select &amp; export：Version → PDF / DOCX。The next user message drives the loop. Each turn executes a predefined tool plan. Scoring reads the base resume / experience; edited artifacts are not automatically rescored.</desc>
