<svg xmlns="http://www.w3.org/2000/svg" width="960" height="912" viewBox="0 0 960 912" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">简历 Agent：系统架构与反馈闭环</title>
<desc id="desc">用评分发现差距，在多轮反馈中修改并保留版本。简历与岗位输入：方向 · 附件 · 新信息；会话规划与工具：意图 · 记忆 · 工具调用；匹配评分与差距：先评分，定位差距；生成与局部润色：定向草稿 · 分块修改；用户复核与二改：核对事实，编辑补充；差距与执行留痕：评分 · 观察 · 版本差异；结构化记忆与版本：档案 · 经历 · 求职方向 · 快照 · 产物；选版与导出：修订版本 → 导出。循环由用户新消息驱动；代码当前按预定工具步骤执行。 评分读取基础简历 / 经历，编辑后的产物尚未自动回流重评分。</desc>
